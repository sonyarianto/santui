name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev

      # clippy subsumes cargo check — only run it once.
      # --all-targets also compiles #[cfg(test)] code in every plugin,
      # so test-only breakage is caught in CI, not at promotion time.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

      # Core crates + stable plugin tests (see scripts/check.sh)
      - run: ./scripts/check.sh test

      - name: Install & run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

