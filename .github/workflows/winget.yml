name: Publish to Winget

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: sonyarianto.Santui
          installers-regex: 'santui-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
