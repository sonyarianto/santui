# Abuse protection for the public catalog endpoint. Average 100 req/min per
# source IP with bursts to 50: generous for radio opens (one full fetch, then
# tiny 304 revalidations), tight enough to blunt naive scraping loops.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api3-ratelimit
  namespace: santui
spec:
  rateLimit:
    average: 100
    period: 1m
    burst: 50
