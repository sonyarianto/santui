apiVersion: apps/v1
kind: Deployment
metadata:
  name: santui-server
  namespace: santui
spec:
  replicas: 1
  # Recreate: the SQLite file lives on an RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: santui-server
  template:
    metadata:
      labels:
        app: santui-server
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: server
          # NOTE: floating tag for the pilot phase; pin to an immutable
          # sha-... tag once the release flow is settled.
          image: ghcr.io/sonyarianto/santui-server:edge
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9876
          env:
            - name: SANTUI_SERVER_HOST
              value: "0.0.0.0"
            - name: SANTUI_SERVER_PORT
              value: "9876"
            - name: SANTUI_SERVER_DATA_DIR
              value: "/data"
            # Baked into the image (see Dockerfile); catalog updates ship
            # with new images.
            - name: SANTUI_STATIONS_DB
              value: "/app/stations/radio_stream_stations.db"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: santui-data
