# Wildcard cert for this namespace (same pattern as apps/db: each namespace
# mints its own via letsencrypt-prod DNS01).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-sony-ak-com
  namespace: santui
spec:
  dnsNames:
    - '*.sony-ak.com'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: wildcard-sony-ak-com-tls
