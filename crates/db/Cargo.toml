[package]
name = "santui-db"
version = "0.2.40"
edition = "2024"
rust-version = "1.85"
description = "Santui central SQLite database — per-user state for plugins"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/sonyarianto/santui"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
