[package]
name = "santui-subnet-calculator"
version = "0.2.38"
edition = "2021"

[[bin]]
name = "santui-subnet-calculator"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.38", default-features = false, features = ["clipboard"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
