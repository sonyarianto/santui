[package]
name = "santui-todo-task-manager"
version = "0.2.39"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-todo-task-manager"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.39", default-features = false, features = ["time"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
