[package]
name = "santui-radio-stream-player"
version = "0.2.40"
edition = "2024"
rust-version = "1.85"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.40", default-features = false, features = ["mpv"] }
ureq = "3"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
log = { workspace = true }
env_logger = { workspace = true }
