[package]
name = "santui-lorem-generator"
version = "0.2.35"
edition = "2021"

[[bin]]
name = "santui-lorem-generator"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.35", default-features = false, features = ["clipboard"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rand = "0.10"
