[package]
name = "santui-music-preview"
version = "0.2.40"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-music-preview"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.40", default-features = false, features = ["mpv"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
ureq        = "3"
log         = { workspace = true }
env_logger  = { workspace = true }
