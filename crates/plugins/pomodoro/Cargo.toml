[package]
name = "santui-pomodoro"
version = "0.2.39"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-pomodoro"
path = "src/main.rs"

[dependencies]
santui-ipc  = { path = "../../ipc",  version = "0.2.39", default-features = false }
santui-core = { path = "../../core", version = "0.2.39" }
serde       = { workspace = true }
serde_json  = { workspace = true }
log         = { workspace = true }
env_logger  = { workspace = true }
