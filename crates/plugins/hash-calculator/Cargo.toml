[package]
name = "santui-hash-calculator"
version = "0.2.39"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-hash-calculator"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.39", default-features = false, features = ["clipboard"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
md-5 = "0.11"
