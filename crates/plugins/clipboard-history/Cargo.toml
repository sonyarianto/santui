[package]
name = "santui-clipboard-history"
version = "0.2.38"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-clipboard-history"
path = "src/main.rs"

[dependencies]
santui-ipc  = { path = "../../ipc",  version = "0.2.38", default-features = false }
arboard     = "3.6"
