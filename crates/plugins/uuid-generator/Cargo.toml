[package]
name = "santui-uuid-generator"
version = "0.2.38"
edition = "2021"

[[bin]]
name = "santui-uuid-generator"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.38", default-features = false, features = ["clipboard"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
uuid = { version = "1", features = ["v4", "v7"] }
