[package]
name = "santui-color-picker"
version = "0.2.39"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-color-picker"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.39", default-features = false, features = ["clipboard"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
