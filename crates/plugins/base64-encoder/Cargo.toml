[package]
name = "santui-base64-encoder"
version = "0.2.39"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-base64-encoder"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.39", default-features = false }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
arboard = "3"
base64 = "0.22"
