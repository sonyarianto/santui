[package]
name = "santui-quran"
version = "0.2.38"
edition = "2021"

[[bin]]
name = "santui-quran"
path = "src/main.rs"

[dependencies]
santui-ipc = { path = "../../ipc", version = "0.2.38", default-features = false, features = ["mpv"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
ureq = "3"
unicode-width = "0.1"
