[package]
name = "santui-rss-reader"
version = "0.2.39"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "santui-rss-reader"
path = "src/main.rs"

[dependencies]
santui-ipc  = { path = "../../ipc",  version = "0.2.39", default-features = false }
ureq        = "3"
feed-rs     = "2.4"
serde       = { workspace = true }
serde_json  = { workspace = true }
log         = { workspace = true }
env_logger  = { workspace = true }
