[package]
name = "santui-ipc"
version = "0.2.36"
edition = "2021"
description = "Santui IPC protocol — typed messages and host plugin runner over JSON lines"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/sonyarianto/santui"

[features]
default = ["host"]
host = ["dep:santui-core", "dep:ratatui", "dep:crossterm"]
clipboard = ["dep:arboard"]
mpv = ["dep:libloading"]
time = ["dep:chrono"]

[dependencies]
santui-core = { path = "../core", version = "0.2.36", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { version = "2", features = ["serde", "std"] }
arboard = { version = "3", optional = true }
libloading = { version = "0.9", optional = true }
chrono = { version = "0.4", optional = true }
log = { workspace = true }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "ipc_bench"
harness = false
