[package]
name = "santui"
version = "0.2.38"
edition = "2024"
rust-version = "1.85"
description = "Santui — keyboard-driven TUI plugin launcher with OAuth sign-in"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/sonyarianto/santui"

[dependencies]
santui-core = { path = "../core", version = "0.2.38" }
santui-ipc = { path = "../ipc", version = "0.2.38" }
santui-auth = { path = "../auth", version = "0.2.38", optional = true }
santui-registry = { path = "../registry", version = "0.2.38" }
santui-db = { path = "../db", version = "0.2.38" }
rusqlite = { version = "0.40", features = ["bundled"] }
log = { workspace = true }
env_logger = { workspace = true }

[features]
default = ["auth"]
auth = ["dep:santui-auth"]
